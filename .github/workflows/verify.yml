name: verify

# Two things are guarded here: no credential gets pushed out with the code, and
# no internal identifier gets back in after the files are edited.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"

  sanitised:
    name: Internal-identifier gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the sanitisation gate
        run: bash scripts/check-sanitised.sh

  syntax:
    name: Shell and YAML parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n on every script
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            bash -n "$f"; echo "parsed: $f"; found=$((found+1))
          done < <(find . -name '*.sh' -not -path './.git/*')
          test "$found" -gt 0
      - name: YAML parse on every manifest
        run: |
          set -e
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml is not available on this runner")
          files = [f for pat in ("**/*.yml", "**/*.yaml") for f in glob.glob(pat, recursive=True) if "/.git/" not in f]
          for f in files:
              with open(f) as fh:
                  # deployment.yaml is multi-document: safe_load_all, not safe_load
                  list(yaml.safe_load_all(fh))
              print("parsed:", f)
          assert files, "no YAML found to check"
          PY
      - name: every local include target exists
        run: |
          set -e
          python3 - <<'PY'
          import glob, os, sys, yaml
          # gateway.yml routes to five templates. If one of the paths is missing,
          # GitLab fails while reading the include, and what fails is someone
          # else's pipeline, not this pipeline. This check closes the "file
          # renamed, include left unchanged" gap.
          missing = []
          for f in glob.glob("ci-library/**/*.yml", recursive=True):
              doc = yaml.safe_load(open(f, encoding="utf-8")) or {}
              for inc in doc.get("include") or []:
                  if isinstance(inc, dict) and inc.get("local"):
                      target = inc["local"].lstrip("/")
                      if not os.path.exists(target):
                          missing.append(f"{f} -> {target}")
          for m in missing:
              print("::error::include does not point at any file:", m)
          sys.exit(1 if missing else 0)
          PY
      - name: shellcheck - errors only (blocking)
        run: |
          shellcheck --version
          # Only the `error` level blocks. That category is real bugs, for example
          # `VAR = value`, which silently stops being an assignment. warning and
          # info are reported but do not block, because the files here are
          # extracted from a system maintained elsewhere: forcing style would
          # make people disable CI instead of fixing code.
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*')
          shellcheck -x --severity=error "${files[@]}"
      - name: shellcheck - warnings (advisory)
        continue-on-error: true
        run: |
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*')
          shellcheck -x --severity=warning "${files[@]}" \
            || echo "::notice::shellcheck found warnings - see the report, this does not block"

  sharedlibrary:
    name: Shared library compiles and its rules pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 21
      # The Groovy version is pinned plus its SHA-256: "compiled successfully" must be
      # the result of a build, not a claim resting on what happens to be on the runner.
      - name: Install Groovy 5.0.3
        run: |
          set -euo pipefail
          curl -fsSLo groovy.zip https://archive.apache.org/dist/groovy/5.0.3/distribution/apache-groovy-binary-5.0.3.zip
          echo "63bd43641292519e0fed40c3ee60215d54e7d2aed828debfeaae34f00b473bbb  groovy.zip" | sha256sum -c -
          unzip -q groovy.zip
          echo "$GITHUB_WORKSPACE/groovy-5.0.3/bin" >> "$GITHUB_PATH"
      - name: groovyc on src and vars
        run: groovyc -cp shared-library/src -d /tmp/glout $(find shared-library/src shared-library/vars -name '*.groovy')
      - name: rule tests
        run: groovy -cp shared-library/src shared-library/test/run.groovy
      # The fixture is the contract the site's pipeline view is built on, so the
      # Groovy side has to keep producing it, not just keep its own assertions green.
      - name: golden fixture matches the Groovy classes
        run: groovy -cp shared-library/src shared-library/test/run-fixture.groovy
      - name: gate entry point selftest
        run: groovy -cp shared-library/src ci-library/scripts/run-gate.groovy --selftest
      # The transcript the /pipelines/ page reads is produced by replay.sh. What is
      # checked here is not its content (the time changes every run) but its shape:
      # every line is uniform and both verdicts are present.
      - name: transcript keeps one log shape
        run: bash ci-library/examples/replay.sh --check

  parity:
    name: JS port reproduces the Groovy fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # ivanjairus.xyz animates rules/release-rules.mjs in the browser. This job is
      # the reason that is an honest claim rather than a look-alike.
      - name: node rules/run-fixture.mjs
        run: node rules/run-fixture.mjs

  copy:
    name: Copy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # The failure message of this gate is read by a human inside a ticket, so the
      # writing shape is checked too: no long dash used as a sentence connector,
      # including the Unicode escape forms that
      # a plain grep cannot see.
      - name: No dash used as a connector
        run: node scripts/assert-copy.mjs --strict

  # Every script in this repo has a --selftest, and this job runs them.
  # The reason is practical: the log line is a contract. ci-library/scripts/lib/log.sh
  # defines its shape, and the /pipelines/ page in my portfolio draws its
  # console from that shape. A script that changes the format without changing
  # the page is caught here, not in someone else's log.
  behavior:
    name: Script selftests (bash + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.12"
      - name: bash tool selftests
        run: |
          set -e
          for s in publish-artifact deploy ticket-sync observability-push; do
            printf '::group::%s\n' "$s"
            bash "ci-library/scripts/$s.sh" --selftest
            printf '::endgroup::\n'
          done
      - name: python tool selftests
        run: |
          set -e
          python3 ci-library/tools/release_stamp.py --selftest
          python3 ci-library/tools/ticket_sync.py --selftest
