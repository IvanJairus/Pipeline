# The one .gitlab-ci.yml shared by ALL developer repositories
# Copy this file to the developer repository root as .gitlab-ci.yml
# Routing happens automatically by Project ID, through gateway.yml
#
# DevOps owns the pipelines in this pipeline-gateway repo.
# Developers do NOT need to change this file.

include:
  - project: 'platform/pipeline-gateway'
    ref: main
    file: '/ci-library/gateway.yml'
