# Pipeline Router
#
# This file is included by .gitlab-ci.yml in EVERY developer repository.
# Routing is by CI_PROJECT_ID, which sends each project to the right template.
#
# A developer repository only needs this in its .gitlab-ci.yml:
#   include:
#     - project: 'platform/pipeline-gateway'
#       ref: main
#       file: '/ci-library/gateway.yml'
#
# A template rename is a one-line change in this file. The .gitlab-ci.yml in
# about forty developer repositories does not need to move.
#
# ── About the data in this file ─────────────────────────────────────────────
# The service names and project IDs below are SYNTHETIC. They are not an
# inventory of the systems where these pipelines originally ran. The convention
# matches the 10.20.x IP range in this repo: a synthetic project ID always sits
# in the 1001-1999 band. scripts/check-sanitised.sh blocks IDs outside that
# band, including ones written bare on an `if:` line, so a sanitising pass that
# only edits comments cannot slip through.
#
# The original had one `rules:` block per domain, and most of its lines were domain
# marker comments. This file cuts nothing but the number of entries listed.

include:
  # ── backend: Java services, jar artifact, tier 1 ──────────────────────────
  - local: '/ci-library/templates/backend.yml'
    rules:
      - if: $CI_PROJECT_ID == "1001"   # identity
      - if: $CI_PROJECT_ID == "1002"   # sessions
      - if: $CI_PROJECT_ID == "1003"   # settlement
      - if: $CI_PROJECT_ID == "1004"   # credentials
      - if: $CI_PROJECT_ID == "1005"   # customer-portal
      - if: $CI_PROJECT_ID == "1006"   # messaging
      - if: $CI_PROJECT_ID == "1007"   # push-relay
      - if: $CI_PROJECT_ID == "1008"   # scheduler

  # ── platform: service configuration and discovery, also jar ───────────────
  - local: '/ci-library/templates/platform.yml'
    rules:
      - if: $CI_PROJECT_ID == "1010"   # config
      - if: $CI_PROJECT_ID == "1011"   # discovery
      - if: $CI_PROJECT_ID == "1012"   # edge

  # ── web: frontend, web artifact, tier 3 ───────────────────────────────────
  # One tier higher: a web deploy follows the backend, it does not lead it.
  - local: '/ci-library/templates/web.yml'
    rules:
      - if: $CI_PROJECT_ID == "1020"   # portal
      - if: $CI_PROJECT_ID == "1021"   # back-office
      - if: $CI_PROJECT_ID == "1022"   # static-assets

  # ── mobile: apk and ipa, no internal registry ─────────────────────────────
  - local: '/ci-library/templates/mobile.yml'
    rules:
      - if: $CI_PROJECT_ID == "1030"   # android
      - if: $CI_PROJECT_ID == "1031"   # ios

  # ── libraries: built, not deployed ────────────────────────────────────────
  # The artifact is maven, but there is no target environment. The promotion rules
  # refuse to promote the projects in this block, and that is intentional.
  - local: '/ci-library/templates/library.yml'
    rules:
      - if: $CI_PROJECT_ID == "1040"   # entities
      - if: $CI_PROJECT_ID == "1041"   # common
      - if: $CI_PROJECT_ID == "1042"   # messaging-lib

  # ── what does NOT go through the gateway ──────────────────────────────────
  # The pipeline repo itself. It runs its own pipeline, and letting it include this
  # file would have the gateway rewriting itself mid-run.
  #
  # The gateway also leaves out the services still building on the old Jenkins.
  # They move in one at a time, and each move aligns the stage contract first,
  # not the file.
