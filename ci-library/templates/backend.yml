# Pipeline template for backend services (Java, jar artifact, tier 1).
#
# Included by ci-library/gateway.yml through CI_PROJECT_ID routing. Developers do
# not edit this file; the only file a developer edits is release.json in their own
# repo.
#
# ── How to read this file ───────────────────────────────────────────────────
# The stage order is not decoration. Each job declares what it needs through
# `needs:`, so GitLab runs whatever CAN run, not whatever appears first in the
# list. That is why `scan:sbom-index` does not wait for `quality`, while
# `deploy-sit` waits for two things at once: the gate verdict and the image digest.
#
# Every job calls a script in ci-library/scripts or a tool in ci-library/tools. No
# logic is written inline twice. If a command shows up in two jobs, that command
# gets its own home in this repo.
#
# ── About the data in this file ─────────────────────────────────────────────
# The project names, namespaces, URLs and IDs below are synthetic. The convention
# matches the project ID band 1001-1999 in gateway.yml and the 10.20.x IP ranges
# elsewhere: the shape is real, the content is not. scripts/check-sanitised.sh
# keeps it that way.

image: maven:3.9-eclipse-temurin-17

variables:
  GIT_DEPTH: "0"                    # the version stamp needs tags, so no shallow clone
  GIT_STRATEGY: fetch
  MAVEN_CLI_OPTS: "--batch-mode --errors --show-version --no-transfer-progress"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  REGISTRY: "registry.example.internal/platform"
  VAULT_ADDR: "https://vault.example.internal"
  TIER: "1"

# Shared cache for all build and test jobs. The key is the SHA of pom.xml, not
# $CI_COMMIT_REF_SLUG: branches with the same dependencies must be able to reuse
# each other's cache, and a branch whose dependencies changed must not inherit a
# stale one.
cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository
  policy: pull-push

stages:
  - build
  - test
  - scan
  - quality
  - gate
  - deploy
  - promote
  - feedback

# ── build ────────────────────────────────────────────────────────────────────

build:release-stamp:
  stage: build
  needs: []
  script:
    - python3 ci-library/tools/release_stamp.py
      --tag-prefix "R"
      --output "build-info.json"
      --audit-line
  artifacts:
    paths:
      - build-info.json
    expire_in: 4 weeks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:maven-package:
  stage: build
  needs:
    - job: build:release-stamp
      artifacts: true
  script:
    - bash ci-library/scripts/build-maven.sh package "$CI_PROJECT_DIR"
  artifacts:
    when: always
    paths:
      - target/*.jar
      - target/surefire-reports/
    expire_in: 1 week
  retry:
    max: 1
    when: runner_system_failure

build:docker-image:
  stage: build
  needs:
    - job: build:maven-package
      artifacts: true
    - job: build:release-stamp
      artifacts: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - bash ci-library/scripts/publish-artifact.sh push
  # The digest comes from the file Kaniko wrote, not from `docker push` output, so
  # the next job gets an image identity that cannot be copied wrong.
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 4 weeks

# ── test ─────────────────────────────────────────────────────────────────────

test:unit:
  stage: test
  needs:
    - job: build:maven-package
      artifacts: true
  script:
    - bash ci-library/scripts/build-maven.sh test "$CI_PROJECT_DIR"
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml

test:contract:
  stage: test
  needs:
    - job: build:maven-package
      artifacts: true
  script:
    - bash ci-library/scripts/build-maven.sh contracts "$CI_PROJECT_DIR"
  artifacts:
    when: always
    reports:
      junit: target/cucumber-reports/*.xml

# ── scan ─────────────────────────────────────────────────────────────────────
# The three run in parallel and never wait on each other. The gate waits for all
# three results; the scans do not.

scan:sast-semgrep:
  stage: scan
  needs: []
  image: semgrep/semgrep:1.79.0
  script:
    - semgrep ci --config auto --sarif-file-output semgrep.sarif
  artifacts:
    when: always
    paths:
      - semgrep.sarif
    expire_in: 4 weeks
  allow_failure: true

scan:secret-detect:
  stage: scan
  needs: []
  image: zricethezav/gitleaks:v8.18.4
  script:
    - gitleaks detect --source . --redact --report-format json --report-path leaks.json
  artifacts:
    when: always
    paths:
      - leaks.json

scan:container-trivy:
  stage: scan
  needs:
    - job: build:docker-image
      artifacts: true
  image: aquasec/trivy:0.53.0
  variables:
    TRIVY_SERVER: "http://trivy-server.platform.svc.cluster.local:4954"
  script:
    - trivy image --severity CRITICAL,HIGH --format json --output trivy-report.json "$REGISTRY/$CI_PROJECT_NAME@$(cat image-digest.txt)"
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 4 weeks

scan:sbom-index:
  stage: scan
  # It needs the jar AND the image, so it waits for two branches at once, but it
  # does not wait for the unit tests. Waiting for everything only delays feedback.
  needs:
    - job: build:maven-package
      artifacts: true
    - job: build:docker-image
      artifacts: true
  image: alpine/syft:v1.9.0
  script:
    - syft "dir:target" -o cyclonedx-json=sbom.json
    - syft "oci:$REGISTRY/$CI_PROJECT_NAME@$(cat image-digest.txt)" -o cyclonedx-json >> sbom.json
    - python3 ci-library/tools/release_stamp.py --verify-sbom sbom.json
  artifacts:
    paths:
      - sbom.json
    expire_in: 13 weeks

# ── quality ──────────────────────────────────────────────────────────────────

quality:sonarqube-checks:
  stage: quality
  needs:
    - job: test:unit
      artifacts: true
    - job: scan:sast-semgrep
      artifacts: true
  image: sonarsource/sonar-scanner-cli:10
  script:
    - sonar-scanner -Dsonar.host.url="$SONAR_HOST" -Dsonar.login="$SONAR_TOKEN"
    - sleep 20                       # wait for the quality gate webhook to arrive
    - SCAN_PROJECT="$CI_PROJECT_NAME" SCAN_TYPE=maven SCAN_SERVICES="$CI_PROJECT_NAME:${RELEASE_TAG:-main}" bash ci-library/scripts/run-scan.sh > sonar-gate.json
  artifacts:
    paths:
      - sonar-gate.json

# ── gate ─────────────────────────────────────────────────────────────────────
# The only place where the pipeline makes its decision. This job calls no
# environment API: it reads the artifacts, compares them with the same thresholds
# Jenkins uses, then writes the verdict.

gate:release-rules:
  stage: gate
  needs:
    - job: scan:container-trivy
      artifacts: true
    - job: scan:secret-detect
      artifacts: true
    - job: quality:sonarqube-checks
      artifacts: true
    - job: build:release-stamp
      artifacts: true
  image: groovy:4.0-jdk17
  script:
    - groovy -cp shared-library/src ci-library/scripts/run-gate.groovy
      --manifest release.json
      --scan trivy-report.json
      --quality sonar-gate.json
      --build build-info.json
  artifacts:
    when: always
    paths:
      - gate-verdict.json
      - gate-summary.txt
    expire_in: 13 weeks

gate:ticket-sync:
  stage: gate
  # The `when: always` here is what keeps the ticket moving when the gate refuses.
  # Without that line, the sync only leaves a trace on pipelines that went green.
  needs:
    - job: gate:release-rules
      artifacts: true
  when: on_success
  allow_failure: true
  script:
    - bash ci-library/scripts/ticket-sync.sh post
  environment:
    name: ticket/$CI_MERGE_REQUEST_IID

# ── deploy ───────────────────────────────────────────────────────────────────

deploy:sit:
  stage: deploy
  resource_group: sit            # one SIT deploy at a time, no exceptions
  needs:
    - job: gate:release-rules
      artifacts: true
    - job: build:docker-image
      artifacts: true
  script:
    - bash ci-library/scripts/deploy.sh apply --env sit --digest "$(cat image-digest.txt)"
    - bash ci-library/scripts/deploy.sh wait --env sit --timeout 300
  environment:
    name: sit
    url: https://sit.$CI_PROJECT_NAME.example.internal
  when: on_success

# ── promote ──────────────────────────────────────────────────────────────────
# Manual at the GitLab level, and the promotion rules refuse it when the ticket
# does not carry a complete approval chain. The button lives here; the right to
# press it lives in the gate.

promote:uat:
  stage: promote
  needs:
    - job: deploy:sit
    - job: gate:release-rules
      artifacts: true
  script:
    - bash ci-library/scripts/deploy.sh promote --from sit --to uat
  environment:
    name: uat
  when: manual
  allow_failure: false

promote:prod:
  stage: promote
  resource_group: prod
  needs:
    - job: promote:uat
    - job: gate:release-rules
      artifacts: true
  script:
    - bash ci-library/scripts/deploy.sh promote --from uat --to prod --wave-plan
  environment:
    name: prod
  when: manual
  allow_failure: false

# ── feedback ─────────────────────────────────────────────────────────────────

feedback:observability:
  stage: feedback
  needs:
    - job: gate:release-rules
      artifacts: true
  # Always runs, including when the pipeline is red: the failure numbers are what
  # the dashboard needs most.
  when: always
  script:
    - bash ci-library/scripts/observability-push.sh pipeline
  artifacts:
    when: always
    paths:
      - metrics.prom
