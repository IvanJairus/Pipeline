# Pipeline template for mobile apps: android (apk) and ios (ipa).
#
# Mobile does not go through the internal registry and has no server environment.
# A deploy here means handing one file to a third-party store, and a store knows no
# rollback: once users accept a build, it stays there. That is why this file is the
# only template that requires a signature BEFORE the artifact counts as existing,
# and the only one whose last stage is not a deploy but an upload to a distribution
# channel that can still be pulled back (the internal testing track).

image: eclipse-temurin:17-jdk

variables:
  GIT_DEPTH: "0"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"

cache:
  key: "mobile-$CI_COMMIT_REF_SLUG"
  paths:
    - android-sdk/
    - gradle/wrapper/dists/
    - .gradle/

stages:
  - build
  - test
  - scan
  - gate
  - sign
  - distribute
  - feedback

build:release-stamp:
  stage: build
  needs: []
  script:
    - python3 ci-library/tools/release_stamp.py --tag-prefix "M" --output "build-info.json"
  artifacts:
    paths:
      - build-info.json

build:apk:
  stage: build
  needs:
    - job: build:release-stamp
      artifacts: true
  tags: [android]
  script:
    - ./gradlew assembleRelease -PbuildInfo="$(cat build-info.json)"
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 4 weeks

test:unit:
  stage: test
  needs:
    - job: build:apk
      artifacts: true
  tags: [android]
  script:
    - ./gradlew testReleaseUnitTest connectedDebugAndroidTest --continue
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/**/*.xml

scan:secrets-in-bundle:
  stage: scan
  # An API key compiled into the bundle cannot be revoked once the app reaches a
  # user's device. Scanning the source is not enough: the scan has to read the
  # final artifact.
  needs:
    - job: build:apk
      artifacts: true
  image: zricethezav/gitleaks:v8.18.4
  script:
    - gitleaks detect --source . --redact --report-format json --report-path leaks.json
    - bash ci-library/scripts/run-scan.sh bundle
  artifacts:
    when: always
    paths:
      - leaks.json
      - bundle-scan.json

gate:release-rules:
  stage: gate
  needs:
    - job: scan:secrets-in-bundle
      artifacts: true
    - job: build:release-stamp
      artifacts: true
  image: groovy:4.0-jdk17
  script:
    - groovy -cp shared-library/src ci-library/scripts/run-gate.groovy
      --manifest release.json --scan bundle-scan.json --artifact-only
  artifacts:
    when: always
    paths:
      - gate-verdict.json
      - gate-summary.txt

sign:apk:
  stage: sign
  resource_group: mobile-keystore
  needs:
    - job: build:apk
      artifacts: true
    - job: gate:release-rules
      artifacts: true
  tags: [android]
  script:
    # The job takes the key as a short-lived lease from Vault, uses it, and
    # revokes it in after_script. The repo never commits signing.properties.
    - bash ci-library/scripts/setup-vault-jwt.sh issue --for keystore
    - bash ci-library/scripts/publish-artifact.sh sign
  after_script:
    - bash ci-library/scripts/setup-vault-jwt.sh revoke || true
  artifacts:
    paths:
      - app/build/outputs/apk/release/*-signed.apk

distribute:internal-track:
  stage: distribute
  needs:
    - job: sign:apk
      artifacts: true
  # Manual: a build moving to the internal track is a human decision, and the trail
  # has to name who pressed the button.
  when: manual
  allow_failure: false
  script:
    - bash ci-library/scripts/publish-artifact.sh distribute --track internal
  environment:
    name: mobile/internal

feedback:observability:
  stage: feedback
  when: always
  needs:
    - job: gate:release-rules
      artifacts: true
  script:
    - bash ci-library/scripts/observability-push.sh pipeline
